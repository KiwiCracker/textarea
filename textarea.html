<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<title>text in browser</title>
	<style>
		html {
			height: 100%;
		}
		body {
			background-color: #141414;
			height: 97.5%;
		}
		textarea {
			background-color: #242424;
			color: #E0E0E0;
			font-size: 48px;
			width: 100%;
			height: 100%;
		}
		.boxsizingBorder { //https://stackoverflow.com/questions/271067/how-can-i-make-a-textarea-100-width-without-overflowing-when-padding-is-present
			-webkit-box-sizing: border-box;
			   -moz-box-sizing: border-box;
			        box-sizing: border-box;
		}
	</style>
</head>
<body>
<textarea class="boxsizingBorder"></textarea>
</body>
</html>
